<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="カウント比較"><title>カウンターと確率比較</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" href="./icons/icon.svg"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head><body><main>
<section id="counter-panel" role="tabpanel" aria-labelledby="counter-tab"><div class="card"><label for="total">総数</label><input id="total" type="text" inputmode="numeric" value="100" aria-describedby="total-error"><p id="total-error" class="error" aria-live="polite"></p></div><div id="counters"></div><button id="reset" class="reset">すべてリセット</button><p id="save-status" class="save-status" role="status">端末に自動保存</p></section>
<section id="compare-panel" role="tabpanel" aria-labelledby="compare-tab" hidden><form id="compare-form" novalidate><div class="card"><h2>実際の結果</h2><div class="two-cols"><div><label for="trials" class="secondary">抽選回数</label><div class="unit"><input id="trials" type="text" inputmode="numeric" value="2000"><span>回</span></div></div><div><label for="wins" class="secondary">当選回数</label><div class="unit"><input id="wins" type="text" inputmode="numeric" value="20"><span>回</span></div></div></div><p id="observed" class="helper"></p></div><div class="card"><h2>比較する当選確率</h2><div class="two-cols"><div class="fraction-input"><span>1 /</span><input id="denom-a" type="text" inputmode="decimal" aria-label="比較する当選確率1の分母" value="120"></div><div class="fraction-input"><span>1 /</span><input id="denom-b" type="text" inputmode="decimal" aria-label="比較する当選確率2の分母" value="70"></div></div><p id="compare-error" class="error" role="alert"></p><button class="primary" type="submit">比較する</button></div></form><div id="results" aria-live="polite"></div></section><p id="offline-status" class="offline-status" role="status"></p>
</main><nav role="tablist" aria-label="機能の切り替え"><button id="counter-tab" role="tab" aria-controls="counter-panel" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V7M19 20V3"/></svg><span>カウンター</span></button><button id="compare-tab" role="tab" aria-controls="compare-panel" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 7h8M8 12h2m4 0h2M8 17h2m4 0h2"/></svg><span>確率の比較</span></button></nav>
<dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description"><form method="dialog"><h2 id="reset-title">すべてリセットしますか？</h2><p id="reset-description">3つのカウンターを0に戻します。総数はそのまま残ります。</p><div class="dialog-actions"><button value="cancel" autofocus>キャンセル</button><button value="reset" class="danger">リセットする</button></div></form></dialog><noscript>JavaScriptを有効にしてください。</noscript></body></html>
