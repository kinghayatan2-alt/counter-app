<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="カウント比較"><title>カウンターと確率比較</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" href="./icons/icon.svg"><link rel="stylesheet" href="./style.css?v=7"><script type="module" src="./app.js?v=7"></script><script type="module" src="./links.js?v=7"></script></head><body><main>
<section id="counter-panel" role="tabpanel" aria-labelledby="counter-tab"><div class="card totals-card"><label for="total">総数</label><div class="total-row"><input id="total" type="text" inputmode="numeric" enterkeyhint="enter" value="100" aria-describedby="total-error"><button id="reset-total" class="reset-total" type="button">リセット</button></div><p id="total-error" class="error" aria-live="polite"></p><div class="extra-field"><label for="extra">追加</label><input id="extra" type="text" inputmode="numeric" enterkeyhint="enter" value="0" aria-describedby="extra-error"><p id="extra-error" class="error" aria-live="polite"></p></div></div><div id="counters"></div><button id="reset" class="reset">すべてリセット</button><p id="save-status" class="save-status" role="status" hidden></p></section>
<section id="compare-panel" role="tabpanel" aria-labelledby="compare-tab" hidden><form id="compare-form" novalidate><div class="card actual-card"><h2>実数</h2><div class="trial-row"><label for="trials" class="secondary">抽選回数</label><div class="unit"><input id="trials" type="text" inputmode="numeric" value="0" enterkeyhint="enter"><span>回</span></div></div><div class="fraction-input actual-input"><span>1 /</span><input id="actual-rate" type="text" inputmode="decimal" value="0" enterkeyhint="enter" aria-label="実数の当選率の分母"></div></div><div class="card"><h2>確認する当選確率</h2><div class="two-cols"><div class="fraction-input"><span>1 /</span><input id="denom-a" type="text" inputmode="decimal" aria-label="比較する当選確率1の分母" value="0" enterkeyhint="enter"></div><div class="fraction-input"><span>1 /</span><input id="denom-b" type="text" inputmode="decimal" aria-label="比較する当選確率2の分母" value="0" enterkeyhint="enter"></div></div><p id="compare-error" class="error" role="alert"></p><button class="primary" type="submit">計算する</button></div></form><div id="results" aria-live="polite"></div><button id="reset-compare" class="reset" type="button">すべてリセット</button></section>
<section id="links-panel" role="tabpanel" aria-labelledby="links-tab" hidden><header class="links-header"><h2>リンク集</h2><button id="links-edit" type="button" class="reset-total">編集</button></header><p id="links-hint" class="helper">登録したリンクをタップして開きます。</p><div id="links-grid" class="links-grid"></div><p id="links-status" role="status" class="error"></p></section></main><nav role="tablist" aria-label="機能の切り替え"><button id="counter-tab" role="tab" aria-controls="counter-panel" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V7M19 20V3"/></svg><span>カウンター</span></button><button id="compare-tab" role="tab" aria-controls="compare-panel" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 7h8M8 12h2m4 0h2M8 17h2m4 0h2"/></svg><span>確率の比較</span></button><button id="links-tab" role="tab" aria-controls="links-panel" aria-selected="false" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-3 3M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l3-3"/></svg><span>リンク集</span></button></nav>
<dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description"><form method="dialog"><h2 id="reset-title">すべてリセットしますか？</h2><p id="reset-description">3つのカウンターを0に戻します。総数はそのまま残ります。</p><div class="dialog-actions"><button value="cancel" autofocus>キャンセル</button><button value="reset" class="danger">リセットする</button></div></form></dialog><dialog id="link-dialog" aria-labelledby="link-dialog-title"><form id="link-form"><h2 id="link-dialog-title">リンクを登録</h2><label for="link-url">URL（必須）</label><input id="link-url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com" required maxlength="4096"><label for="link-name" class="link-name-label">表示名（任意）</label><input id="link-name" type="text" maxlength="80" autocomplete="off"><p id="link-form-error" class="error" role="alert"></p><div class="dialog-actions"><button id="link-cancel" type="button">キャンセル</button><button type="submit">保存</button></div></form></dialog><noscript>JavaScriptを有効にしてください。</noscript></body></html>
